<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Tracker</title>
<link rel="stylesheet" href="/vendor/maplibre-gl@6.3.0/maplibre-gl.css">
<link rel="stylesheet" href="{{.CSS}}">
</head>
<body class="app" data-mode="live"
      data-tiles="{{.Tiles}}"
      data-layers="{{.Layers}}"
      data-sprite="{{.Sprite}}"
      data-glyphs="{{.Glyphs}}"
      data-bounds="{{index .Bounds 0}},{{index .Bounds 1}},{{index .Bounds 2}},{{index .Bounds 3}}">

<div id="map"></div>

<aside id="panel">
  <header>
    <h1>Fleet</h1>
    <span id="conn" class="badge" data-state="connecting">connecting</span>
  </header>

  <nav class="modes" role="tablist">
    <button type="button" data-mode="live" class="active" role="tab" aria-selected="true">Live</button>
    <button type="button" data-mode="history" role="tab" aria-selected="false">History</button>
  </nav>

  <section id="live-pane">
    <ul id="fleet">
      {{range .Fleet}}
      <li data-hex="{{.Hex}}" data-status="no_contact"{{if .Reference}} data-reference="true"{{end}}>
        <button type="button" class="row" aria-label="Show {{.Rego}} on the map">
          <span class="rego">{{.Rego}}</span>
          <span class="type">{{.Type}}</span>
          <span class="status">no contact</span>
          <span class="detail"></span>
        </button>
      </li>
      {{end}}
    </ul>
    <p class="hint" id="ref-note">
      Reference aircraft below are airliners, not yours. They are here to prove
      the feed is working: if they are blank too, the problem is this end.
    </p>
  </section>

  <section id="history-pane" hidden>
    <div class="controls">
      <label class="sr" for="h-aircraft">Aircraft</label>
      <select id="h-aircraft">
        <option value="">All aircraft</option>
        {{range .Fleet}}<option value="{{.Hex}}">{{.Rego}}</option>{{end}}
      </select>
      <label class="sr" for="h-range">Period</label>
      <select id="h-range">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="365">Last year</option>
        <option value="0">Everything</option>
      </select>
    </div>
    <p id="h-status" class="hint">Loading…</p>
    <ul id="flights"></ul>
  </section>

  <footer>
    <form method="post" action="/logout"><button type="submit" class="link">Sign out</button></form>
    <p class="attrib">
      Positions <a href="https://adsb.lol/">adsb.lol</a>,
      <a href="https://adsb.fi/">adsb.fi</a>.
      Map © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.
    </p>
  </footer>
</aside>

<div id="scrubber" hidden>
  <button type="button" id="play" aria-label="Play">▶</button>
  <input type="range" id="slider" min="0" max="0" value="0" aria-label="Position along the flight">
  <span id="readout"></span>
</div>

<script src="/vendor/pmtiles@4.5.0/pmtiles.js"></script>
<script type="module" src="{{.JS}}" defer></script>
</body>
</html>
